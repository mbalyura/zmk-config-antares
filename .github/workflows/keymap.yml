name: Draw keymap

on:
  push:
    paths:
      - 'config/antares.keymap'
      - 'config/combos.dtsi'
      - 'config/antares.json'
      - 'keymap-drawer/**'
      - '.github/workflows/keymap.yml'
  pull_request:
    paths:
      - 'config/antares.keymap'
      - 'config/combos.dtsi'
      - 'config/antares.json'
      - 'keymap-drawer/**'
      - '.github/workflows/keymap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keymap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keymap-drawer
        run: python -m pip install keymap-drawer==0.23.0
      - name: Draw all layers and combos
        run: |
          keymap -c keymap-drawer/config.yaml parse -c 10 -z config/antares.keymap --layer-names DEF NAV SYM NUM GAM SYS SWP -o /tmp/antares.yaml
          keymap -c keymap-drawer/config.yaml draw /tmp/antares.yaml -j config/antares.json -o keymap-drawer/antares.svg
      - name: Upload pull request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: antares-keymap
          path: keymap-drawer/antares.svg
      - name: Commit updated drawing
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- keymap-drawer/antares.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: update keymap drawing"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
